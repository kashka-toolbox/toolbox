name: Create and publish a multi-arch Docker image

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Playwright Tests"]
    types: [completed]
    branches: [development, production]

env:
  REGISTRY: ghcr.io
  UPPER_IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  preconditions:
    runs-on: ubuntu-latest
    steps:
      - name: Check preconditions
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" && "${{ github.event.workflow_run.conclusion }}" != "success" ]]; then
            echo "Precondition failed: previous workflow was not successful."
            exit 1
          fi
          echo "Preconditions met, proceeding with workflow."

  prepare:
    runs-on: ubuntu-latest
    needs: preconditions
    outputs:
      image-name: ${{ steps.step1.outputs.IMAGE_NAME }}
    steps:
      - name: Convert image name
        id: step1
        run: |
          echo "IMAGE_NAME=$(echo $UPPER_IMAGE_NAME | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

  # Dispatch builds

  build-amd64:
    name: Build AMD64 Image
    uses: ./.github/workflows/build-docker.yml
    needs: prepare
    permissions:
      contents: read
      packages: write
    with:
      platform-runner: ubuntu-latest
      platform-name: linux/amd64
      digest-name: linux-amd64
      image-name: ${{ needs.prepare.outputs.image-name }}
    secrets: inherit

  build-arm64:
    name: Build ARM64 Image
    uses: ./.github/workflows/build-docker.yml
    needs: prepare
    permissions:
      contents: read
      packages: write
    with:
      platform-runner: ubuntu-24.04-arm
      platform-name: linux/arm64
      digest-name: linux-arm64
      image-name: ${{ needs.prepare.outputs.image-name }}
    secrets: inherit

  # Merge and publish multi-arch image

  merge:
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build-amd64
      - build-arm64
    env:
      IMAGE_NAME: ${{ needs.prepare.outputs.image-name }}
      BUILDX_NO_DEFAULT_ATTESTATIONS: 1
    permissions:
      contents: none
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith( github.ref, 'refs/tags/' ) }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}